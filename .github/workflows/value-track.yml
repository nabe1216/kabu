name: value-track

# 低PBR順のルールを、仮想で並走記録する。
#
# 過去7年の検証では本番（利回りの高い順）を上回ったが、
# その優位の多くは2023年のPBR改革のあと。これから先で確かめる。
#
# 動く順番
#   「Generate Dividend Signals」が成功したあとに動く。
#
# 本番トラック（portfolio_engine.py）には一切影響しない。
on:
  workflow_run:
    workflows: ["Generate Dividend Signals"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    # シグナル生成が失敗した日は動かさない（古いデータで記録しないため）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 低PBR順を記録する
        run: python value_engine.py

      - name: 保存する
        run: |
          if git diff --quiet -- data/value_state.json data/value_history.json; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/value_state.json data/value_history.json
          git commit -m "低PBR順の記録"
          # 入れ替えの記録と同時に保存することがあるので、ぶつかったら少し待って送り直す
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "送信に失敗しました（${i}回目）。少し待って送り直します。"
            sleep $((i * 5))
          done
          echo "3回送り直しても保存できませんでした。"
          exit 1
