name: patch-cache

# 財務データをキャッシュして、毎日の実行時間を短くする。
# 実際の書き換えは tools/apply_cache.py が行う。
# 目印が見つからない場合や文法エラーが出た場合は何も保存せずに止まる。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "財務データを何日もたせるか。7で週1回、0でキャッシュを使わない"
        required: false
        default: "7"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate.py を書き換える
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: python tools/apply_cache.py

      - name: 保存する
        run: |
          if git diff --quiet -- scripts/generate.py; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate.py
          git commit -m "財務データのキャッシュを追加"
          git push
