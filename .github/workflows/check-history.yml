name: check-history

# 株価をさかのぼれる正確な上限を突き止める。
# 前回の調査で「7年は可・10年は不可」と分かったので、その間を詰める。
# あわせて Stooq が使えるかを別の書き方で試す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests

      - name: 上限を詰める
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
        run: |
          python - <<'PY'
          import os, time
          from datetime import date, timedelta
          import requests

          KEY = os.environ["J_QUANTS_API_KEY"]
          H = {"x-api-key": KEY}
          UA = {"User-Agent": "Mozilla/5.0 (probe)"}
          TODAY = date.today()
          out = []

          def w(s=""):
              out.append(s); print(s)

          w("## 株価をさかのぼれる上限")
          w()
          w("| 年数 | 結果 | 最古日 |")
          w("|---|---|---|")

          best_years, best_oldest, err_full = 0, None, ""
          for y in (7, 8, 9):
              frm = (TODAY - timedelta(days=365 * y + 30)).isoformat()
              try:
                  r = requests.get("https://api.jquants.com/v2/equities/bars/daily",
                                   params={"code": "9432", "from": frm,
                                           "to": TODAY.isoformat()},
                                   headers=H, timeout=60)
                  if r.status_code != 200:
                      err_full = r.text
                      w(f"| {y}年 | 弾かれた（HTTP {r.status_code}） | — |")
                      break
                  rows = r.json().get("data") or []
                  ds = sorted(str(x.get("Date",""))[:10] for x in rows if x.get("Date"))
                  w(f"| {y}年 | 取得できた（{len(rows):,}件） | {ds[0] if ds else '—'} |")
                  if ds:
                      best_years, best_oldest = y, ds[0]
              except Exception as e:
                  w(f"| {y}年 | 失敗 | {str(e)[:60]} |")
                  break
              time.sleep(1.5)
          w()

          if err_full:
              w("### 弾かれたときの返答（全文）")
              w()
              w("```")
              w(err_full[:600])
              w("```")
              w()

          # ── Stooq を別の書き方で試す ──
          w("### Stooq（無料の株価）を再確認")
          w()
          w("| 書き方 | 結果 | 最古日 |")
          w("|---|---|---|")
          stooq_ok = None
          for sym in ("9432.jp", "9432.JP", "9432.t"):
              try:
                  r = requests.get("https://stooq.com/q/d/l/",
                                   params={"s": sym, "i": "d"}, headers=UA, timeout=45)
                  lines = [x for x in r.text.strip().splitlines() if x]
                  if len(lines) > 2 and lines[0].lower().startswith("date"):
                      first = lines[1].split(",")[0]
                      w(f"| {sym} | 取得できた（{len(lines)-1:,}件） | {first} |")
                      stooq_ok = first
                  else:
                      body = r.text.strip()[:40].replace("\n", " ")
                      w(f"| {sym} | 取得できず（HTTP {r.status_code} / {body}） | — |")
              except Exception as e:
                  w(f"| {sym} | 失敗 | {str(e)[:40]} |")
              time.sleep(1.5)
          w()

          w("### 結論")
          w()
          if best_oldest:
              yrs = round((TODAY - date(*map(int, best_oldest.split("-")))).days / 365.25, 1)
              w(f"- 株価は **{best_oldest}** まで（約 {yrs} 年）が上限")
              w(f"- 配当データは 2016-09 まで（約10年）あるので、**株価が制約**")
              w()
              w(f"**分位に使える最大 … 約 {yrs} 年**")
              w()
              w(f"→ generate.py の設定を **{best_years}年** にできる（いまは3年）")
          if stooq_ok:
              w()
              w(f"- Stooq も使えた（{stooq_ok} から）。株価をこちらに替えれば10年まで伸ばせる可能性あり")
          else:
              w()
              w("- Stooq は GitHub の実行環境からは取得できず。株価はJ-Quantsのみで考える")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          PY
