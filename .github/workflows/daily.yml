name: Generate Dividend Signals

# 平日 19:30 JST = 10:30 UTC に自動実行
# 土日は市場が閉まっていてデータが変わらないので動かさない。
# （毎日動かすと GitHub Actions の無料枠 月2,000分 を超えるため）
# 手動実行も可能（workflow_dispatch）
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

# results.json をコミットするための権限
permissions:
  contents: write

# 2026年11月14日：手動の実行と定時の実行が重なると、あとから終わった方が保存できない
# （同じ results.json・履歴ファイルを両方が書き換えて、取り込みでぶつかる。11月14日の #208 で起きた）。
# 同時には1つだけ動かし、あとから来た方は前の実行が終わるまで待つ。
concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 対象を small1 に広げて約72分（遅い日は76分）。
    # 2026年11月6日：分割を読むため株価を10年前から取るようにして、1銘柄あたりの取得が少し増えた。
    # 遅い日に90分を超えて止まらないよう、上限を120分にする（公開リポジトリなので実行時間の費用はかからない）。
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 毎日の自動点検（health_check.py）が、実行時間を見るために使う
      - name: Record start time
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run generate.py
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          python scripts/generate.py

      # 2026年11月8日：毎日の自動点検。結果は data/health.json（ダッシュボードが警告を出す）。
      # 点検が失敗しても、判定の保存は止めない。
      - name: Health check
        continue-on-error: true
        env:
          TZ: Asia/Tokyo
        run: |
          python scripts/health_check.py

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/results.json data/portfolio_state.json data/portfolio_history.json
          # 2026年11月10日：買う順番の並走記録（12月1日から。variant_engine）
          for f in data/variant_*_state.json data/variant_*_history.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # 2026年11月8日：銘柄ごとの履歴は data/history/ に分けた（増えたファイル・消えたファイルも含めて保存）
          if [ -d data/history ]; then
            git add -A data/history
          fi
          if [ -f data/health.json ]; then
            git add data/health.json
          fi
          # 財務データのキャッシュ（2026年11月8日から圧縮。古い圧縮なしのファイルは消したことも保存する）
          if [ -f data/stmts_cache.json.gz ]; then
            git add data/stmts_cache.json.gz
          fi
          if [ -f data/stmts_cache.json ]; then
            git add data/stmts_cache.json
          elif git ls-files --error-unmatch data/stmts_cache.json > /dev/null 2>&1; then
            git rm -q --cached data/stmts_cache.json
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update results.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # 72分のあいだに他の記録が保存していると、そのままでは拒否される。
            # 最新を取り込んでから送る。
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload results as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: data/results.json
          retention-days: 14
