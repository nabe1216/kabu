name: Generate Dividend Signals

# 平日 19:30 JST = 10:30 UTC に自動実行
# 土日は市場が閉まっていてデータが変わらないので動かさない。
# （毎日動かすと GitHub Actions の無料枠 月2,000分 を超えるため）
# 手動実行も可能（workflow_dispatch）
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

# results.json をコミットするための権限
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # 対象を small1 に広げて約72分。上限まで18分の余裕がある。
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run generate.py
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          python scripts/generate.py

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/results.json data/portfolio_state.json data/portfolio_history.json
          # 財務データのキャッシュ（無ければ飛ばす）
          if [ -f data/stmts_cache.json ]; then
            git add data/stmts_cache.json
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update results.json ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            # 72分のあいだに他の記録が保存していると、そのままでは拒否される。
            # 最新を取り込んでから送る。
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload results as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: data/results.json
          retention-days: 14
