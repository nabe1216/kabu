name: patch-scope

# 対象にする規模区分を段階的に選ぶ。
#
#   core   … Core30 / Large70 / Mid400   約489社・40分
#   small1 … 上記 + TOPIX Small 1        社数は回してみないと分からない
#   prime  … プライム全銘柄               約1,555社・118分（90分の枠に収まらない）
#
# 時価総額では絞れない。銘柄一覧に時価総額が含まれておらず、
# 各銘柄を取得したあとでしか分からないため。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "対象の範囲。core / small1 / prime"
        required: false
        default: "small1"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate.py を書き換える
        env:
          SCOPE: ${{ github.event.inputs.scope || 'small1' }}
        run: python tools/apply_scope.py

      - name: 保存する
        run: |
          if git diff --quiet -- scripts/generate.py; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate.py
          git commit -m "対象の規模区分を変更"
          git push
