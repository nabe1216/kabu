name: rotation-track

# 入れ替えルールの並走フォワードテスト。
#
# 動く順番
#   「Generate Dividend Signals」が成功したあとに動く。
#   以前は時刻（20:15）で動かしていたが、シグナル生成が72分かかるようになり、
#   前日のデータを読んだり、シグナル生成の保存とぶつかったりするおそれが出たため。
#
# 出力は data/rotation_state.json など別ファイルなので、
# 既存のダッシュボード表示には影響しない。
on:
  workflow_run:
    workflows: ["Generate Dividend Signals"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    # シグナル生成が失敗した日は動かさない（古いデータで記録しないため）
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 入れ替えトラックを更新
        run: |
          set +e
          python scripts/rotation_engine.py > run.log 2>&1
          code=$?
          {
            echo "## 入れ替えトラック"
            echo ""
            if [ $code -ne 0 ]; then echo "**失敗しました（終了コード $code）**"; fi
            echo '```'
            tail -c 8000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat run.log
          exit $code

      - name: 記録を保存
        if: success()
        run: |
          if git diff --quiet -- data/rotation_state.json data/rotation_history.json; then
            echo "変化なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rotation_state.json data/rotation_history.json
          git commit -m "chore: 入れ替えトラックを更新 ($(date -u +%Y-%m-%d))"
          # レンジの記録と同時に保存することがあるので、ぶつかったら少し待って送り直す
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "送信に失敗しました（${i}回目）。少し待って送り直します。"
            sleep $((i * 5))
          done
          echo "3回送り直しても保存できませんでした。"
          exit 1
