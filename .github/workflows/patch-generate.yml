name: patch-generate

# generate.py の「利回りの分位を何年分で計算するか」を変える。
# 何度でも実行でき、そのつど年数を指定できる。
#
# 目印が見つからない場合や、書き換え後に文法エラーが出た場合は
# 何も保存せずに止まるので、壊れる心配はない。
on:
  workflow_dispatch:
    inputs:
      years:
        description: "分位に使う年数（取得できる上限は9年）"
        required: false
        default: "9"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate.py を書き換える
        env:
          YEARS: ${{ github.event.inputs.years || '9' }}
        run: |
          python - <<'PY'
          import ast, os, re, sys
          from pathlib import Path

          years = int(os.environ.get("YEARS", "9"))
          p = Path("scripts/generate.py")
          s = before = p.read_text(encoding="utf-8")
          log = []

          # ── 1. 株価の取得年数 ──
          # 分位の期間を伸ばしても、株価がそれだけ無いと意味がないので合わせる。
          m = re.search(r"^YIELD_LOOKBACK_YEARS\s*=\s*(\d+)", s, re.M)
          if not m:
              sys.exit("YIELD_LOOKBACK_YEARS が見つかりません。中止します。")
          old = int(m.group(1))
          s = re.sub(r"^YIELD_LOOKBACK_YEARS\s*=\s*\d+",
                     f"YIELD_LOOKBACK_YEARS = {years}", s, count=1, flags=re.M)
          log.append(f"株価の取得年数 … {old}年 → {years}年")

          # ── 2. 分位の計算年数 ──
          if re.search(r"^YIELD_DISTRIBUTION_YEARS\s*=\s*\d+", s, re.M):
              old2 = int(re.search(r"^YIELD_DISTRIBUTION_YEARS\s*=\s*(\d+)", s, re.M).group(1))
              s = re.sub(r"^YIELD_DISTRIBUTION_YEARS\s*=\s*\d+",
                         f"YIELD_DISTRIBUTION_YEARS = {years}", s, count=1, flags=re.M)
              log.append(f"分位の計算年数 … {old2}年 → {years}年")
          else:
              # まだ無ければ定数と処理を両方入れる（初回のみ通る）
              a1 = "YIELD_LOOKBACK_DAYS = YIELD_LOOKBACK_YEARS * 365 + 60  # 余裕を持って取得"
              if a1 not in s:
                  sys.exit("目印1が見つかりません。中止します。")
              s = s.replace(a1, a1 + "\n"
                            "# 分位（Q25/Q75）の計算に使う期間。取得期間より短くもできる。\n"
                            f"YIELD_DISTRIBUTION_YEARS = {years}", 1)
              a2 = ("    yields_sorted = sorted(yields)\n"
                    "    return {\n"
                    "        'q25': quantile(yields_sorted, 0.25),")
              if s.count(a2) != 1:
                  sys.exit(f"目印2が {s.count(a2)} 箇所です。中止します。")
              s = s.replace(a2,
                    "    # 分位の計算は直近 YIELD_DISTRIBUTION_YEARS 年ぶんだけを使う。\n"
                    "    dist_months = YIELD_DISTRIBUTION_YEARS * 12\n"
                    "    yields_for_dist = yields[-dist_months:] if len(yields) > dist_months else yields\n"
                    "    yields_sorted = sorted(yields_for_dist)\n"
                    "    return {\n"
                    "        'q25': quantile(yields_sorted, 0.25),", 1)
              log.append(f"分位の計算年数 … 新規に {years}年 を設定")

          if s == before:
              print("変更はありませんでした。")
              sys.exit(0)

          ast.parse(s)                      # 文法チェックを通ってから保存
          p.write_text(s, encoding="utf-8")
          print("\n".join(log))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## generate.py の変更\n\n")
              for x in log:
                  f.write(f"- {x}\n")
              f.write("\n次に「Generate Dividend Signals」を手動実行してください。\n")
              f.write(f"成功すれば results.json の yield_sample_n が {years*12} 前後になります。\n")
          PY

      - name: 保存する
        run: |
          if git diff --quiet -- scripts/generate.py; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate.py
          git commit -m "分位の計算期間を変更"
          git push
