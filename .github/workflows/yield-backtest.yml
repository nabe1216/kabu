name: yield-backtest

# 配当利回りルールの比較用。既存の backtest.yml（検証運用）とは別物です。
# Actions タブ → 左の yield-backtest → 右の「Run workflow」
# 結果は実行後の Summary 画面にそのまま表示されます。
#
# 株価の取得に時間がかかるため、取得したデータはキャッシュに残します。
# 2回目以降は取得を飛ばして、ルールの比較だけを繰り返せます。
on:
  workflow_dispatch:
    inputs:
      years:
        description: "検証する年数（取得できるのが約5年なので2〜3が目安）"
        required: false
        default: "2"
      diagnose_tier:
        description: "Tier判定の中身を調べる（true/false）。売買はしません"
        required: false
        default: "false"
      sweep:
        description: "分位の期間を振って比較（例: 12,24,36,48,60,72,84）。空欄なら通常の比較"
        required: false
        default: ""
      lookback:
        description: "利回り分布を作る月数（既定36）。短くすると検証期間を前に伸ばせます"
        required: false
        default: "36"
      only:
        description: "比較するルール（空欄で全部）。例: fixed,tranche,dynamic"
        required: false
        default: ""
      max_names:
        description: "同時に持つ最大銘柄数。空欄なら通常15・実運用モードで20"
        required: false
        default: ""
      capital:
        description: "元本（円）。空欄なら通常300万・実運用モードで1000万"
        required: false
        default: ""
      range_test:
        description: "レンジ（ボックス）売買を検証する（true/false）。下限で買い上限で売る形を日次で回します"
        required: false
        default: "false"
      range_opts:
        description: "レンジの設定。「日数,幅の下限,幅の上限,買い幅,売り幅,諦める幅」の順。既定 60,0.08,0.20,0.02,0.02,0"
        required: false
        default: "60,0.08,0.20,0.02,0.02,0"
      grid:
        description: "条件を総当たりで検証する（true/false）。どの条件でも成り立つ結論だけを取り出します"
        required: false
        default: "false"
      grid_ramp:
        description: "総当たりで試す資金投入の月数（カンマ区切り）"
        required: false
        default: "0,12"
      grid_lookback:
        description: "総当たりで試す分位の月数（カンマ区切り）。例: 24,60"
        required: false
        default: "24"
      grid_max_names:
        description: "総当たりで試す保有上限（カンマ区切り）。例: 20,30"
        required: false
        default: "20"
      grid_min_yield:
        description: "総当たりで試す利回り足切り（カンマ区切り）"
        required: false
        default: "0,3"
      walk:
        description: "この年数の窓を1年ずつずらして何度も検証（例: 4）。空欄なら通常の比較"
        required: false
        default: ""
      min_yield:
        description: "この利回り（％）未満は買わない。実運用のスクリーニング相当。0で無効"
        required: false
        default: "0"
      ramp:
        description: "資金を何か月かけて入れるか。0なら初日に全額、12なら毎月1/12ずつ"
        required: false
        default: "0"
      show_trades:
        description: "建玉の明細を表示する（true/false）"
        required: false
        default: "false"
      universe:
        description: "対象。core＝大型〜中型（489社）、prime＝プライム全銘柄（約1600社・取得に70分前後）"
        required: false
        default: "core"
      tax:
        description: "譲渡益と配当への税率（％）。特定口座なら 20.315、無視するなら 0"
        required: false
        default: "20.315"
      slip_bps:
        description: "約定のずれ（bps）。10 で片道0.1％"
        required: false
        default: "10"
      fee_bps:
        description: "手数料（bps）。無料コースなら 0"
        required: false
        default: "0"
      realistic:
        description: "実運用と同じ条件で回す（true/false）。1000万・Tier別予算・20銘柄・配当あり"
        required: false
        default: "true"
      refetch:
        description: "株価を取り直す（true/false）。初回とデータ更新時のみ true"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install --quiet numpy pandas requests

      # 取得済みの株価データを再利用する。週ごとに作り直す。
      - name: キャッシュを復元
        uses: actions/cache@v4
        with:
          path: data/yield_backtest_cache.pkl
          key: yield-backtest-cache-v1-${{ github.run_id }}
          restore-keys: |
            yield-backtest-cache-v1-

      - name: バックテストを実行
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
        run: |
          set +e
          python yield_backtest.py \
            --years "${{ github.event.inputs.years || '2' }}" \
            --lookback "${{ github.event.inputs.lookback || '36' }}" \
            --universe "${{ github.event.inputs.universe || 'core' }}" \
            --min-yield "${{ github.event.inputs.min_yield || '0' }}" \
            --ramp "${{ github.event.inputs.ramp || '0' }}" \
            ${{ github.event.inputs.range_test == 'true' && '--range-test' || '' }} \
            --range-opts "${{ github.event.inputs.range_opts || '60,0.08,0.20,0.02,0.02,0' }}" \
            ${{ github.event.inputs.grid == 'true' && '--grid' || '' }} \
            --grid-ramp "${{ github.event.inputs.grid_ramp || '0,12' }}" \
            --grid-min-yield "${{ github.event.inputs.grid_min_yield || '0,3' }}" \
            --grid-lookback "${{ github.event.inputs.grid_lookback || '24' }}" \
            --grid-max-names "${{ github.event.inputs.grid_max_names || '20' }}" \
            ${{ github.event.inputs.walk != '' && format('--walk {0}', github.event.inputs.walk) || '' }} \
            ${{ github.event.inputs.show_trades == 'true' && '--show-trades' || '' }} \
            --tax "${{ github.event.inputs.tax || '20.315' }}" \
            --slip-bps "${{ github.event.inputs.slip_bps || '10' }}" \
            --fee-bps "${{ github.event.inputs.fee_bps || '0' }}" \
            --max-names "${{ github.event.inputs.max_names || '0' }}" \
            --capital "${{ github.event.inputs.capital || '0' }}" \
            ${{ github.event.inputs.only != '' && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.realistic == 'true' && '--realistic' || '' }} \
            ${{ github.event.inputs.refetch == 'true' && '--refetch' || '' }} > run.log 2>&1
          code=$?
          {
            echo "## バックテスト結果"
            echo ""
            if [ $code -ne 0 ]; then echo "**失敗しました（終了コード $code）**"; fi
            echo '```'
            tail -c 14000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat run.log
          exit $code

      - name: 結果をダウンロードできるようにする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yield-backtest-result
          path: |
            data/yield_backtest.csv
            data/yield_backtest.json
            data/lookback_sweep.csv
            data/walk_forward.csv
            data/grid.csv
            data/range_test.csv
            data/range_trades.csv
            run.log
          if-no-files-found: ignore
