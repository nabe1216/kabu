name: box-scan

# 画面のボタンから手動で実行できます。
# Actions タブ → 左の box-scan → 右の「Run workflow」
#
# 実行結果とエラー内容は、実行後の Summary 画面にそのまま表示されます。
# ログを開いて探す必要はありません。
on:
  workflow_dispatch:
    inputs:
      window:
        description: "信頼性を測る期間（営業日）。360＝約1年半。長いほど精度が上がります"
        required: false
        default: "360"
      entry_window:
        description: "売買の上下限を出す期間（営業日）。120＝約6か月"
        required: false
        default: "120"
      min_score:
        description: "この点数以上を候補にする（既定55）"
        required: false
        default: "55"
      limit:
        description: "試し実行。先頭N銘柄だけ処理（0で全銘柄）"
        required: false
        default: "0"
      include_down:
        description: "下降チャネルも候補に含める（true/false）"
        required: false
        default: "false"
      include_broken:
        description: "レンジを抜けた銘柄も含める（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install --quiet numpy pandas requests

      - name: 置かれているファイルを確認
        run: |
          {
            echo "## 1. ファイルの配置"
            echo ""
            if [ -f box_detect.py ]; then echo "- box_detect.py … あり"; else echo "- box_detect.py … **見つかりません**"; fi
            if [ -f box_scan.py ];   then echo "- box_scan.py … あり";   else echo "- box_scan.py … **見つかりません**"; fi
            echo ""
            echo "リポジトリ直下のファイル一覧:"
            echo '```'
            ls -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: シークレットの状態を確認
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
        run: |
          {
            echo "## 2. シークレット"
            echo ""
            if [ -z "$J_QUANTS_API_KEY" ]; then
              echo "- J_QUANTS_API_KEY … **空です**（登録名をご確認ください）"
            else
              echo "- J_QUANTS_API_KEY … 読み込めています（${#J_QUANTS_API_KEY} 文字）"
              echo "- J-Quants V2 の API キーとして x-api-key ヘッダーに付けて送ります"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ボックス判定を実行
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
        run: |
          set +e
          python box_scan.py \
            --window "${{ github.event.inputs.window || '360' }}" \
            --entry-window "${{ github.event.inputs.entry_window || '120' }}" \
            --min-score "${{ github.event.inputs.min_score || '55' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            ${{ github.event.inputs.include_down == 'true' && '--include-down' || '' }} \
            ${{ github.event.inputs.include_broken == 'true' && '--include-broken' || '' }} > run.log 2>&1
          code=$?
          {
            echo "## 3. 実行結果"
            echo ""
            if [ $code -eq 0 ]; then echo "成功しました。"; else echo "**失敗しました（終了コード $code）**"; fi
            echo ""
            echo '```'
            tail -c 12000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat run.log
          exit $code

      - name: 結果をダウンロードできるようにする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: box-scan-result
          path: |
            data/box.csv
            data/box.json
            run.log
          if-no-files-found: ignore

      - name: 結果をリポジトリに保存
        if: success()
        run: |
          if git diff --quiet -- data/box.json data/box.csv; then
            echo "変化なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/box.json data/box.csv
          git commit -m "chore: ボックス判定を更新 ($(date -u +%Y-%m-%d))"
          git push
