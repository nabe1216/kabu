name: box-scan

# 画面のボタンから手動で実行できます。
# Actions タブ → 左の box-scan → 右の「Run workflow」
on:
  workflow_dispatch:
    inputs:
      window:
        description: "判定期間（営業日）。120＝約6か月、240＝約1年"
        required: false
        default: "120"
      min_score:
        description: "この点数以上だけ表示（0〜100）"
        required: false
        default: "70"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install --quiet numpy pandas requests

      - name: ボックス判定を実行
        env:
          # kabu リポジトリに登録済みのシークレット名
          JQUANTS_REFRESH_TOKEN: ${{ secrets.J_QUANTS_API_KEY }}
        run: |
          python box_scan.py \
            --window "${{ github.event.inputs.window || '120' }}" \
            --min-score "${{ github.event.inputs.min_score || '70' }}"

      - name: 結果をダウンロードできるようにする
        uses: actions/upload-artifact@v4
        with:
          name: box-scan-result
          path: |
            data/box.csv
            data/box.json

      - name: 結果をリポジトリに保存
        run: |
          if git diff --quiet -- data/box.json data/box.csv; then
            echo "変化なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/box.json data/box.csv
          git commit -m "chore: ボックス判定を更新 ($(date -u +%Y-%m-%d))"
          git push
