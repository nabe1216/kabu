name: wide-lab

# 東証の全銘柄で、日本株の手法の型をまとめて確かめる（2026年11月4日に追加）。
# 今までの yield-backtest（配当の手法）とは別物で、データも別のキャッシュに持つ。
# 計画と記録はプロジェクトの method_map_2026-11-04・wide_lab_plan_2026-11-04・wide_lab_plan2_2026-11-04。
# Actions タブ → 左の wide-lab → 右の「Run workflow」
#   mode=fetch … 東証全銘柄のデータを集める（時間切れなら取った分を保存して止まるので、もう一度押すと続きから）
#   mode=lab1  … データがそろっていれば、1回目の型（24通り）をまとめて回す
#   mode=lab2  … 同じく、2回目の型（出来事と暦の7通り）をまとめて回す
#   mode=lab3  … 3回目（組み合わせ。VQM は固定、SEL は combo に1回目で効いた型を入れる。wide_lab_plan3_2026-11-04）
#   mode=lab4  … 4回目（売買の内訳。プレミアムだけのデータ。wide_lab_plan4_2026-11-04。スタンダードに戻す前に long-cleanup で消す）
#   mode=lab5  … 5段目（残りの型。配当金情報（プレミアムだけ）・空売り残高の報告・決算発表予定日を営業日ごとに取る。wide_lab_plan5_2026-11-04。
#                キャッシュの名前を yield-backtest-long- で始めているので、long-cleanup で消える）
#   mode=lab10 … 10段目（5段目の出来事の型 ＋ 空いている資金は TOPIX。5段目のデータを使う。wide_lab_plan10_2026-11-05）
#   mode=lab11 … 11段目（10段目を時価総額の上位500社・1,000社だけで。確かめる段階は cfg に候補（例 DIVUP/TOP1000）。wide_lab_plan11_2026-11-05）
#   mode=xfetch … 配当金情報と決算発表予定日の履歴だけを取る（成績は計算しない。20年分で確かめる前の準備）
#   mode=lab12 … 12段目（財務の明細の型：粗利益の大きさ・Fスコア。明細はプレミアムだけ。wide_lab_plan12_2026-11-05）
#   mode=lab13 … 13段目（J-Quants の残りのデータ：投資部門別・業種別空売り比率・日々公表・オプション・先物・EDINET。wide_lab_plan13_2026-11-05）
#   mode=lab14 … 14段目（費用と税の前提を変えて、1〜5・8〜13段目をまとめて回し直す。cost で前提を選ぶ。wide_lab_plan14_2026-11-05）
#   mode=lab15 … 15段目（出来事の型の組み立て方の探索。確かめる段階は cfg に形（例 DIVUP/TOP1000/60/20）。wide_lab_plan15_2026-11-05）
#   mode=lab16 … 16段目（加重の仕方） ／ lab17 … 17段目（暦と短期の残り。years=20・explore で回す） ／ lab18 … 18段目（毎月の点数の残り。個別株オプションを取る） ／ lab19 … 19段目（組み合わせと空売り側）
#   mode=lab20 … 20段目（市況〈日経平均・原油・金利・為替・VIX〉で切り替える。FRED と財務省の公開データを取る。years=20。wide_lab_plan20_2026-11-05）
#   mode=lab21 … 21段目（上岡式〈2016年の本〉の答え合わせ。業種別空売り比率〈スタンダード〉を日ごとに取り、data/wide_k.pkl に持つ。years=9。wide_lab_plan21_2026-11-08）
#   mode=lab22 … 22段目（DUKE。新高値ブレイク投資術〈2016年7月〉と CAN SLIM の日本版。years=9。wide_lab_plan22_2026-11-09）
#   mode=lab23 … 23段目（弐億貯男・井村俊哉・PEG・みきまる・清原達郎の近い形。月末の運用の形。years=9。wide_lab_plan23_2026-11-09）
#   mode=lab24 … 24段目（ヘム『「増配」株投資』2025年1月の数値の決まり。years=9。wide_lab_plan24_2026-11-09）
#   mode=lab25 … 25段目（たーちゃん『50万円を50億円に増やした』2025年7月の数値の決まり。years=9。wide_lab_plan25_2026-11-10）
#   mode=lab26 … 26段目（なのなの『「爆配当」株投資』2023年12月の数値の決まり。years=9。wide_lab_plan26_2026-11-10）
#   mode=lab27 … 27段目（ミネルヴィニ『ミネルヴィニの成長株投資法』原書2013年。毎日の売り買い。years=9。wide_lab_plan27_2026-11-10）
#   mode=lab28 … 28段目（ALFA『高配当株で小金持ちになる方法』の往復銘柄。毎日の売り買い。years=9。wide_lab_plan28_2026-11-10）
#   cost=S0 … 第1部と同じ（株 片道0.2％・1306 片道0.1％・税20.315％） ／ S1 … 低い費用（0.1％・0.05％・税あり） ／ S2 … 低い費用・税なし
#   years=9  … 探す段階（スタンダードで足りる9年分。data/wide_cache.pkl）
#   years=20 … 確かめる段階（プレミアムの20年分。data/wide_long.pkl。キャッシュの名前を yield-backtest-long- で始めているので、
#              プレミアムをやめる前に long-cleanup を1回動かせば、yield-backtest の20年分と一緒に消える）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch＝データを集める ／ lab1＝1回目の型（24通り） ／ lab2＝2回目（出来事と暦） ／ lab3＝3回目（組み合わせ） ／ lab4＝4回目（売買の内訳） ／ lab5＝5段目（残りの型） ／ lab6＝6段目（短期売買） ／ lab7＝7段目（組み立て方） ／ lab8＝8段目（空売り） ／ lab9＝9段目（まとめて学ばせる） ／ lab10＝10段目（出来事＋TOPIX） ／ lab11＝11段目（出来事・大型株） ／ lab12＝12段目（財務の明細） ／ lab13＝13段目（残りのデータ） ／ lab14＝14段目（費用と税の前提で、1〜5・8〜13段目をまとめて回し直す） ／ lab15＝15段目（出来事の組み立て方） ／ lab16＝16段目（加重） ／ lab17＝17段目（暦と短期。years=20） ／ lab18＝18段目（点数の残り） ／ lab19＝19段目（組み合わせ・空売り側） ／ lab20＝20段目（市況で切り替える。years=20） ／ lab21＝21段目（上岡式の答え合わせ。years=9） ／ lab22＝22段目（DUKE。・CAN SLIM。years=9） ／ lab23＝23段目（成長×割安の手法。years=9） ／ lab24＝24段目（ヘムの増配株。years=9） ／ lab25＝25段目（たーちゃんの3つの投資法。years=9） ／ lab26＝26段目（なのなのの高配当株。years=9） ／ lab27＝27段目（ミネルヴィニ。years=9） ／ lab28＝28段目（往復銘柄。years=9） ／ xfetch＝配当金情報などを取るだけ"
        required: true
        default: "fetch"
        type: choice
        options:
          - fetch
          - lab1
          - lab2
          - lab3
          - lab4
          - lab5
          - lab6
          - lab7
          - lab8
          - lab9
          - lab10
          - lab11
          - lab12
          - lab13
          - lab14
          - lab15
          - lab16
          - lab17
          - lab18
          - lab19
          - lab20
          - lab21
          - lab22
          - lab23
          - lab24
          - lab25
          - lab26
          - lab27
          - lab28
          - xfetch
      years:
        description: "9＝探す段階（9年分） ／ 20＝確かめる段階（プレミアムの20年分）"
        required: true
        default: "9"
        type: choice
        options:
          - "9"
          - "20"
      only:
        description: "回す型の記号（カンマ区切り。空欄なら全部）。確かめる段階で候補だけを回すとき。例: BP,E1"
        required: false
        default: ""
      combo:
        description: "lab3 だけ：1回目で「範囲の中では効く」以上だった型の記号（カンマ区切り。2つ以上で SEL を回す）"
        required: false
        default: ""
      cfg:
        description: "lab7・lab11・lab15 の確かめる段階だけ：回す組み立て（例: VQM/TOP500/20/Q ／ DIVUP/TOP1000 ／ DIVUP/TOP1000/60/20）"
        required: false
        default: ""
      stage:
        description: "years=20 のときだけ：explore＝探す段階（9年分と同じ期間だけ使う） ／ confirm＝確かめる段階（見ていない期間も使う。候補が決まってから）"
        required: true
        default: "explore"
        type: choice
        options:
          - explore
          - confirm
      threads:
        description: "データを同時に取る数。スタンダードは1（呼び出しの上限が小さい）。プレミアムなら3〜4で速くなる"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      cost:
        description: "費用と税の前提（14段目）：S0＝第1部と同じ（株 片道0.2％・1306 片道0.1％・税20.315％） ／ S1＝低い費用（0.1％・0.05％・税あり） ／ S2＝低い費用・税なし"
        required: true
        default: "S0"
        type: choice
        options:
          - S0
          - S1
          - S2

permissions:
  contents: read
  actions: write        # キャッシュの古い控えを消すため

concurrency:
  group: wide-lab-${{ inputs.years }}     # 同じ年数どうしは1つずつ（キャッシュを取り合わないように）
  cancel-in-progress: false

env:
  CACHE_PATH: ${{ inputs.years == '20' && 'data/wide_long.pkl' || 'data/wide_cache.pkl' }}
  # 9年分は、11月9日から v2（スタンダードに戻したあとに取り直したもの）を使う。v1 はプレミアムの期間中（11月4日）に取ったもので、
  # long-cleanup の2つめの欄に「消す」と入れると消える（v2 は消えない）
  CACHE_PREFIX: ${{ inputs.years == '20' && 'yield-backtest-long-wide-v1-' || 'wide-lab-cache-v2-' }}
  # 売買の内訳（プレミアムだけのデータ）。名前を yield-backtest-long- で始めて、long-cleanup で一緒に消えるようにする
  BD_PATH: ${{ inputs.years == '20' && 'data/wide_bd_long.pkl' || 'data/wide_bd.pkl' }}
  BD_PREFIX: ${{ inputs.years == '20' && 'yield-backtest-long-bdl-v1-' || 'yield-backtest-long-bd-v1-' }}
  # 5段目のデータ（配当金情報はプレミアムだけ）。同じく long-cleanup で消えるように
  X_PATH: ${{ inputs.years == '20' && 'data/wide_x_long.pkl' || 'data/wide_x.pkl' }}
  X_PREFIX: ${{ inputs.years == '20' && 'yield-backtest-long-xl-v1-' || 'yield-backtest-long-x-v1-' }}
  # 21段目の業種別空売り比率（スタンダードで取るデータ。プレミアムの時期のデータとは別に持つ）
  K_PATH: data/wide_k.pkl
  K_PREFIX: wide-lab-k-v1-

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install --quiet numpy pandas requests

      # 復元と保存を分けて、途中で止まった実行でも取った分を保存する（yield-backtest と同じ考え方）
      - name: キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_PREFIX }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}

      - name: 売買の内訳のキャッシュを復元
        if: ${{ inputs.mode == 'lab4' || inputs.mode == 'lab14' || inputs.mode == 'lab16' || inputs.mode == 'lab19' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BD_PATH }}
          key: ${{ env.BD_PREFIX }}
          restore-keys: |
            ${{ env.BD_PREFIX }}

      - name: 5段目のデータのキャッシュを復元
        if: ${{ inputs.mode == 'lab5' || inputs.mode == 'lab10' || inputs.mode == 'lab11' || inputs.mode == 'lab12' || inputs.mode == 'lab13' || inputs.mode == 'lab14' || inputs.mode == 'lab15' || inputs.mode == 'lab16' || inputs.mode == 'lab18' || inputs.mode == 'lab19' || inputs.mode == 'lab20' || inputs.mode == 'xfetch' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.X_PATH }}
          key: ${{ env.X_PREFIX }}
          restore-keys: |
            ${{ env.X_PREFIX }}

      - name: 21段目のデータのキャッシュを復元
        if: ${{ inputs.mode == 'lab21' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.K_PATH }}
          key: ${{ env.K_PREFIX }}
          restore-keys: |
            ${{ env.K_PREFIX }}

      - name: 実行
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
          WIDE_YEARS: ${{ inputs.years }}
          WIDE_THREADS: ${{ inputs.threads }}
          WIDE_STAGE: ${{ inputs.stage }}
          WIDE_COST: ${{ inputs.cost }}
          WIDE_PATHS: "1"        # 15段目：cfg で形を選んだとき、始める月をずらした12通りのばらつきも出す（判定には使わない）
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          set -o pipefail
          # 途中の様子が実行の画面で見えるように、画面とファイルの両方に出す
          python wide_lab.py --mode "${{ inputs.mode }}" --only "${{ inputs.only }}" --combo "${{ inputs.combo }}" --cfg "${{ inputs.cfg }}" 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          {
            echo "## wide-lab（${{ inputs.mode }}・${{ inputs.years }}年分${{ inputs.years == '20' && format('・{0}', inputs.stage) || '' }}${{ inputs.only != '' && format('・{0}', inputs.only) || '' }}${{ inputs.cost != 'S0' && format('・費用{0}', inputs.cost) || '' }}）"
            echo ""
            if [ $code -eq 3 ]; then echo "**まだ終わっていません。同じ設定のまま、もう一度「Run workflow」を押してください（取った分は保存しました）**"; fi
            if [ $code -ne 0 ] && [ $code -ne 3 ]; then echo "**失敗しました（終了コード $code）**"; fi
            echo '```'
            tail -c 40000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: キャッシュを保存
        if: ${{ always() && hashFiles(env.CACHE_PATH) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}

      - name: 売買の内訳のキャッシュを保存
        if: ${{ always() && inputs.mode == 'lab4' && hashFiles(env.BD_PATH) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BD_PATH }}
          key: ${{ env.BD_PREFIX }}${{ github.run_id }}

      - name: 5段目のデータのキャッシュを保存
        if: ${{ always() && (inputs.mode == 'lab5' || inputs.mode == 'lab10' || inputs.mode == 'lab11' || inputs.mode == 'lab12' || inputs.mode == 'lab13' || inputs.mode == 'lab18' || inputs.mode == 'lab20' || inputs.mode == 'xfetch') && hashFiles(env.X_PATH) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.X_PATH }}
          key: ${{ env.X_PREFIX }}${{ github.run_id }}

      - name: 21段目のデータのキャッシュを保存
        if: ${{ always() && inputs.mode == 'lab21' && hashFiles(env.K_PATH) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.K_PATH }}
          key: ${{ env.K_PREFIX }}${{ github.run_id }}

      # 1回の保存が大きいので、新しい2つだけ残す（GitHub のキャッシュは全部で10GBまで。
      # 超えると、使われていない古いものから消され、yield-backtest の9年分が消えることがある）
      - name: 古い控えを整理する（新しい2つは残す）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_PREFIX}&sort=created_at&direction=desc&per_page=100" \
                --jq '.actions_caches[2:][] | .id' || true)
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" && n=$((n+1))
          done
          echo "古い控えを ${n} 個消しました。"
          if [ "${{ inputs.mode }}" = "lab4" ]; then
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${BD_PREFIX}&sort=created_at&direction=desc&per_page=100" \
                  --jq '.actions_caches[2:][] | .id' || true)
            for id in $ids; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true; done
          fi
          if [ "${{ inputs.mode }}" = "lab21" ]; then
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${K_PREFIX}&sort=created_at&direction=desc&per_page=100" \
                  --jq '.actions_caches[2:][] | .id' || true)
            for id in $ids; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true; done
          fi
          if [ "${{ inputs.mode }}" = "lab5" ] || [ "${{ inputs.mode }}" = "lab10" ] || [ "${{ inputs.mode }}" = "lab11" ] || [ "${{ inputs.mode }}" = "lab12" ] || [ "${{ inputs.mode }}" = "lab13" ] || [ "${{ inputs.mode }}" = "lab18" ] || [ "${{ inputs.mode }}" = "lab20" ] || [ "${{ inputs.mode }}" = "xfetch" ]; then
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${X_PREFIX}&sort=created_at&direction=desc&per_page=100" \
                  --jq '.actions_caches[2:][] | .id' || true)
            for id in $ids; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true; done
          fi

      - name: 結果をダウンロードできるようにする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 20年分の結果は long-cleanup で消せる名前にする
          name: ${{ inputs.years == '20' && 'yield-backtest-long-result' || format('wide-lab-{0}-{1}-result', inputs.mode, inputs.cost) }}
          path: run.log
          if-no-files-found: ignore
