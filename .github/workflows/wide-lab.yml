name: wide-lab

# 東証の全銘柄で、日本株の手法の型をまとめて確かめる（2026年11月4日に追加）。
# 今までの yield-backtest（配当の手法）とは別物で、データも別のキャッシュに持つ。
# 計画と記録はプロジェクトの method_map_2026-11-04・wide_lab_plan_2026-11-04・wide_lab_plan2_2026-11-04。
# Actions タブ → 左の wide-lab → 右の「Run workflow」
#   mode=fetch … 東証全銘柄のデータを集める（時間切れなら取った分を保存して止まるので、もう一度押すと続きから）
#   mode=lab1  … データがそろっていれば、1回目の型（24通り）をまとめて回す
#   mode=lab2  … 同じく、2回目の型（出来事と暦の7通り）をまとめて回す
#   mode=lab3  … 3回目（組み合わせ。VQM は固定、SEL は combo に1回目で効いた型を入れる。wide_lab_plan3_2026-11-04）
#   mode=lab4  … 4回目（売買の内訳。プレミアムだけのデータ。wide_lab_plan4_2026-11-04。スタンダードに戻す前に long-cleanup で消す）
#   years=9  … 探す段階（スタンダードで足りる9年分。data/wide_cache.pkl）
#   years=20 … 確かめる段階（プレミアムの20年分。data/wide_long.pkl。キャッシュの名前を yield-backtest-long- で始めているので、
#              プレミアムをやめる前に long-cleanup を1回動かせば、yield-backtest の20年分と一緒に消える）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch＝データを集める ／ lab1＝1回目の型（24通り） ／ lab2＝2回目（出来事と暦） ／ lab3＝3回目（組み合わせ） ／ lab4＝4回目（売買の内訳・プレミアムだけ）"
        required: true
        default: "fetch"
        type: choice
        options:
          - fetch
          - lab1
          - lab2
          - lab3
          - lab4
      years:
        description: "9＝探す段階（9年分） ／ 20＝確かめる段階（プレミアムの20年分）"
        required: true
        default: "9"
        type: choice
        options:
          - "9"
          - "20"
      only:
        description: "回す型の記号（カンマ区切り。空欄なら全部）。確かめる段階で候補だけを回すとき。例: BP,E1"
        required: false
        default: ""
      combo:
        description: "lab3 だけ：1回目で「範囲の中では効く」以上だった型の記号（カンマ区切り。2つ以上で SEL を回す）"
        required: false
        default: ""
      stage:
        description: "years=20 のときだけ：explore＝探す段階（9年分と同じ期間だけ使う） ／ confirm＝確かめる段階（見ていない期間も使う。候補が決まってから）"
        required: true
        default: "explore"
        type: choice
        options:
          - explore
          - confirm
      threads:
        description: "データを同時に取る数。スタンダードは1（呼び出しの上限が小さい）。プレミアムなら3〜4で速くなる"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read
  actions: write        # キャッシュの古い控えを消すため

concurrency:
  group: wide-lab-${{ inputs.years }}     # 同じ年数どうしは1つずつ（キャッシュを取り合わないように）
  cancel-in-progress: false

env:
  CACHE_PATH: ${{ inputs.years == '20' && 'data/wide_long.pkl' || 'data/wide_cache.pkl' }}
  CACHE_PREFIX: ${{ inputs.years == '20' && 'yield-backtest-long-wide-v1-' || 'wide-lab-cache-v1-' }}
  # 売買の内訳（プレミアムだけのデータ）。名前を yield-backtest-long- で始めて、long-cleanup で一緒に消えるようにする
  BD_PATH: ${{ inputs.years == '20' && 'data/wide_bd_long.pkl' || 'data/wide_bd.pkl' }}
  BD_PREFIX: ${{ inputs.years == '20' && 'yield-backtest-long-bdl-v1-' || 'yield-backtest-long-bd-v1-' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: pip install --quiet numpy pandas requests

      # 復元と保存を分けて、途中で止まった実行でも取った分を保存する（yield-backtest と同じ考え方）
      - name: キャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_PREFIX }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}

      - name: 売買の内訳のキャッシュを復元
        if: ${{ inputs.mode == 'lab4' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BD_PATH }}
          key: ${{ env.BD_PREFIX }}
          restore-keys: |
            ${{ env.BD_PREFIX }}

      - name: 実行
        env:
          J_QUANTS_API_KEY: ${{ secrets.J_QUANTS_API_KEY }}
          WIDE_YEARS: ${{ inputs.years }}
          WIDE_THREADS: ${{ inputs.threads }}
          WIDE_STAGE: ${{ inputs.stage }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          set -o pipefail
          # 途中の様子が実行の画面で見えるように、画面とファイルの両方に出す
          python wide_lab.py --mode "${{ inputs.mode }}" --only "${{ inputs.only }}" --combo "${{ inputs.combo }}" 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          {
            echo "## wide-lab（${{ inputs.mode }}・${{ inputs.years }}年分${{ inputs.years == '20' && format('・{0}', inputs.stage) || '' }}${{ inputs.only != '' && format('・{0}', inputs.only) || '' }}）"
            echo ""
            if [ $code -eq 3 ]; then echo "**まだ終わっていません。同じ設定のまま、もう一度「Run workflow」を押してください（取った分は保存しました）**"; fi
            if [ $code -ne 0 ] && [ $code -ne 3 ]; then echo "**失敗しました（終了コード $code）**"; fi
            echo '```'
            tail -c 40000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: キャッシュを保存
        if: ${{ always() && hashFiles(env.CACHE_PATH) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: ${{ env.CACHE_PREFIX }}${{ github.run_id }}

      - name: 売買の内訳のキャッシュを保存
        if: ${{ always() && inputs.mode == 'lab4' && hashFiles(env.BD_PATH) != '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BD_PATH }}
          key: ${{ env.BD_PREFIX }}${{ github.run_id }}

      # 1回の保存が大きいので、新しい2つだけ残す（GitHub のキャッシュは全部で10GBまで。
      # 超えると、使われていない古いものから消され、yield-backtest の9年分が消えることがある）
      - name: 古い控えを整理する（新しい2つは残す）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_PREFIX}&sort=created_at&direction=desc&per_page=100" \
                --jq '.actions_caches[2:][] | .id' || true)
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" && n=$((n+1))
          done
          echo "古い控えを ${n} 個消しました。"
          if [ "${{ inputs.mode }}" = "lab4" ]; then
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${BD_PREFIX}&sort=created_at&direction=desc&per_page=100" \
                  --jq '.actions_caches[2:][] | .id' || true)
            for id in $ids; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true; done
          fi

      - name: 結果をダウンロードできるようにする
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 20年分の結果は long-cleanup で消せる名前にする
          name: ${{ inputs.years == '20' && 'yield-backtest-long-result' || format('wide-lab-{0}-result', inputs.mode) }}
          path: run.log
          if-no-files-found: ignore
