<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MACRO LENS">
<meta name="description" content="経済指標がどう株価に伝わるかを、経路として学ぶ学習アプリ。">
<title>MACRO LENS ─ 指標と株価をつなぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#fff;--bg-subtle:#F9FAFB;--bg-hover:#F3F4F6;
 --border:#E5E7EB;--border-strong:#D1D5DB;
 --text:#111827;--text-2:#6B7280;--text-3:#9CA3AF;
 --indigo:#4F46E5;--indigo-text:#4338CA;--indigo-bg:#EEF2FF;
 --green:#059669;--green-bg:#ECFDF5;--blue:#2563EB;--blue-bg:#EFF6FF;
 --purple:#7C3AED;--purple-bg:#F5F3FF;--amber:#D97706;--amber-bg:#FFFBEB;
 --red:#DC2626;--red-bg:#FEF2F2;
 --r-sm:6px;--r:8px;--r-lg:10px;--r-pill:999px;
 --font:"Noto Sans JP",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);
 line-height:1.85;font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}

/* ── サイドバー ─────────────────── */
.side{width:244px;flex:0 0 244px;border-right:1px solid var(--border);
 padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.mark{width:34px;height:34px;border-radius:var(--r);background:var(--indigo);color:#fff;
 display:grid;place-items:center;font-weight:700;font-size:13px}
.bname{font-weight:700;font-size:13.5px;line-height:1.35}
.bsub{font-size:10px;color:var(--text-3);letter-spacing:.1em;font-weight:500}

.prog{margin:0 8px 16px;padding:12px 13px;border:1px solid var(--border);
 border-radius:var(--r);background:var(--bg-subtle)}
.prog-t{font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--text-3)}
.prog-n{font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.pbar{height:6px;background:var(--bg-hover);border-radius:3px;overflow:hidden;margin-top:7px}
.pbar-f{height:100%;background:var(--indigo);width:0;transition:width .35s;border-radius:3px}
.prog-s{font-size:11px;color:var(--text-2);margin-top:6px;line-height:1.6}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-lbl{margin:12px 0 4px;padding:0 11px;font-size:10px;font-weight:600;
 letter-spacing:.09em;color:var(--text-3)}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;
 width:100%;padding:8px 11px;border-radius:var(--r);color:var(--text-2);border:none;
 background:none;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
 text-align:left;transition:.12s}
.nav button:hover{background:var(--bg-hover);color:var(--text)}
.nav button.on{background:var(--indigo-bg);color:var(--indigo-text);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
.nav .cnt{font-size:11px;color:var(--text-3);font-weight:500}
.nav .done{color:var(--green);font-size:12px}

.switcher{margin:18px 8px 0;padding-top:16px;border-top:1px solid var(--border)}
.sw-lbl{font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--text-3);padding:0 3px 7px}
.sw-link{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--border);
 border-radius:var(--r);text-decoration:none;transition:.12s;background:var(--bg)}
.sw-link:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.sw-mark{width:26px;height:26px;flex:0 0 26px;border-radius:var(--r-sm);background:var(--indigo);
 color:#fff;display:grid;place-items:center;font-weight:700;font-size:10px}
.sw-n{display:block;font-size:12px;font-weight:600;color:var(--text);line-height:1.4}
.sw-s{display:block;font-size:10.5px;color:var(--text-3)}
.sw-arw{margin-left:auto;color:var(--text-3);font-size:12px}

/* ── メイン ───────────────────── */
.main{flex:1;min-width:0}
.topbar{border-bottom:1px solid var(--border);padding:18px 32px;display:flex;
 align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;
 background:rgba(255,255,255,.94);backdrop-filter:blur(6px);z-index:20}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.topbar .meta{font-size:12px;color:var(--text-3)}
.menu-btn{display:none;font-family:inherit;font-size:13px;background:var(--bg);
 border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;cursor:pointer;color:var(--text-2)}
.content{padding:24px 32px 90px;max-width:920px}
.intro{font-size:13.5px;color:var(--text-2);margin-bottom:22px;max-width:42em}
.intro b{font-weight:600;color:var(--text)}

.h2{font-size:15px;font-weight:700;margin:34px 0 4px}
.h2s{font-size:12.5px;color:var(--text-3);margin-bottom:14px}
.lab{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--text-3);padding:0 20px;margin-top:16px}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:var(--r-pill);white-space:nowrap;display:inline-block}
.p-i{background:var(--indigo-bg);color:var(--indigo-text)}
.p-a{background:var(--amber-bg);color:var(--amber)}
.p-p{background:var(--purple-bg);color:var(--purple)}
.p-g{background:var(--green-bg);color:var(--green)}
.p-u{background:var(--red-bg);color:var(--red)}
.p-d{background:var(--blue-bg);color:var(--blue)}
.p-f{background:var(--bg-hover);color:var(--text-2)}
.p-num{background:var(--red-bg);color:var(--red)}
.p-den{background:var(--blue-bg);color:var(--blue)}
.p-both{background:var(--purple-bg);color:var(--purple)}
.p-neutral{background:var(--bg-subtle);color:var(--text-2);border:1px solid var(--border)}

/* ── トピック／カード共通 ─────────── */
.topic,.card,.q{border:1px solid var(--border);border-radius:var(--r-lg);
 background:var(--bg);margin-bottom:14px;overflow:hidden}
.t-h{padding:16px 20px 0;display:flex;align-items:flex-start;gap:11px}
.t-id{font-size:11px;font-weight:600;color:var(--text-2);background:var(--bg-subtle);
 border:1px solid var(--border);padding:2px 8px;border-radius:var(--r-pill);flex:0 0 auto;margin-top:3px}
.t-q{font-size:16px;font-weight:700;line-height:1.6;letter-spacing:-.01em}
.answer{margin:5px 20px 0;padding:13px 16px;background:var(--indigo-bg);border-radius:var(--r);
 font-size:15px;font-weight:600;line-height:1.7;color:var(--indigo-text)}
.figbox{margin:6px 20px 0;border:1px solid var(--border);border-radius:var(--r);
 background:var(--bg-subtle);padding:8px 10px}
.cap{padding:9px 20px 16px;font-size:12px;color:var(--text-3)}
.prose{padding:4px 20px 0}
.prose p{font-size:13.5px;margin-top:13px;color:#374151}
.prose b,.deep b{font-weight:600;color:var(--text)}
.warn{margin:14px 20px 18px;background:var(--amber-bg);border:1px solid #FDE68A;
 border-radius:var(--r);padding:12px 15px;font-size:13px;color:#78350F;line-height:1.75}
.warn b{font-weight:600;display:block;margin-bottom:3px}
.hl{margin:16px 20px 0;padding:12px 15px;background:var(--indigo-bg);border-radius:var(--r);
 font-size:13.5px;color:var(--indigo-text);font-weight:600;line-height:1.7}

.deep-btn{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
 border-top:1px solid var(--border);padding:12px 20px;cursor:pointer;font-family:inherit;
 font-weight:600;font-size:13px;color:var(--text-2);text-align:left;transition:.12s}
.deep-btn:hover{background:var(--bg-subtle);color:var(--text)}
.deep-btn:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
.chev{color:var(--text-3);font-size:11px;transition:transform .18s}
.deep-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.deep{padding:2px 20px 18px;background:var(--bg-subtle);border-top:1px solid var(--border)}
.deep p{font-size:13px;margin-top:12px;color:#374151;line-height:1.8}

.term{border:none;background:none;padding:0 1px;font:inherit;color:var(--indigo-text);
 font-weight:500;border-bottom:1px dotted var(--indigo);cursor:pointer;border-radius:2px}
.term:hover{background:var(--indigo-bg)}
.term:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}

/* ── 経路ステッパー ─────────────── */
.chain{display:flex;padding:6px 20px 0;overflow-x:auto;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.st{flex:1 0 150px;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;
 margin-right:22px;position:relative;background:var(--bg)}
.st:last-child{margin-right:0}
.st::after{content:"";position:absolute;right:-16px;top:50%;width:10px;height:10px;
 border-top:1.5px solid var(--border-strong);border-right:1.5px solid var(--border-strong);
 transform:translateY(-50%) rotate(45deg)}
.st:last-child::after{display:none}
.st-n{font-size:9.5px;font-weight:600;letter-spacing:.11em;color:var(--text-3)}
.st-v{font-size:12.5px;margin-top:3px;line-height:1.6;font-weight:500}
.st.acc{background:var(--indigo-bg);border-color:#C7D2FE}
.st.acc .st-v{color:var(--indigo-text)}

/* ── 分数図 ─────────────────────── */
.mf{border:1px solid var(--border);border-radius:var(--r);margin:6px 20px 0;overflow:hidden}
.mf-body{display:flex;align-items:center;padding:14px}
.mf-eq{flex:0 0 62px;font-weight:700;font-size:14px;color:var(--text-2);text-align:center}
.mf-frac{flex:1;min-width:0}
.mf-row{border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;
 display:flex;align-items:center;gap:10px;background:var(--bg);transition:.25s}
.mf-bar{height:2px;background:var(--text);margin:7px 0;border-radius:1px}
.mf-name{font-weight:600;font-size:13.5px;flex:1}
.mf-drv{font-size:11px;color:var(--text-2);font-weight:400}
.mf-arw{font-weight:600;font-size:12px;padding:2px 11px;border-radius:var(--r-pill);
 background:var(--bg-subtle);color:var(--text-3);transition:.25s}
.up{background:var(--red-bg);border-color:#FCA5A5}.up .mf-arw{background:#FEE2E2;color:var(--red)}
.dn{background:var(--blue-bg);border-color:#BFDBFE}.dn .mf-arw{background:#DBEAFE;color:var(--blue)}
.mf-out{border-top:1px solid var(--border);background:var(--bg-subtle);
 display:flex;align-items:center;gap:12px;padding:11px 14px}
.mf-v{font-weight:600;font-size:13px;padding:4px 13px;border-radius:var(--r-pill);white-space:nowrap}
.mf-why{font-size:12.5px;color:var(--text-2);flex:1;line-height:1.7}
.why-box{padding:14px 20px 18px;font-size:13.5px;color:#374151;line-height:1.8}

/* ── 指標カタログ ──────────────── */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.filters button,.modes button,.pfilter button{font-family:inherit;font-size:12.5px;font-weight:500;
 background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);
 padding:6px 14px;cursor:pointer;color:var(--text-2);transition:.12s}
.filters button:hover,.modes button:hover,.pfilter button:hover{background:var(--bg-hover);color:var(--text)}
.filters button[aria-pressed="true"],.modes button[aria-pressed="true"]{
 background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
.pfilter button[aria-pressed="true"]{background:var(--indigo-bg);border-color:#C7D2FE;
 color:var(--indigo-text);font-weight:600}
.filters button:focus-visible,.modes button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.modes{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.modes button{font-size:13px;padding:8px 16px}
.pfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

.tbl{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px}
.tbl-h,.tbl-r{display:grid;grid-template-columns:1.6fr .9fr .9fr .8fr;gap:10px;padding:11px 16px;align-items:center}
.tbl-h{background:var(--bg-subtle);border-bottom:1px solid var(--border);
 font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.05em}
.tbl-r{border-bottom:1px solid var(--border);font-size:13px;transition:background .12s}
.tbl-r:last-child{border-bottom:none}
.tbl-r:hover{background:var(--bg-subtle)}
.tbl-n{font-weight:600}
.tbl-sub{font-size:11px;color:var(--text-3)}

.card-h{width:100%;background:none;border:none;font-family:inherit;text-align:left;
 padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:background .12s}
.card-h:hover{background:var(--bg-subtle)}
.card-h:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
.card-nm{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.card-en{font-size:11px;color:var(--text-3);font-weight:500}
.card-tags{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.oneline{padding:0 18px 15px 40px;font-size:13.5px;color:var(--text-2);margin-top:-8px}
.body{border-top:1px solid var(--border);background:var(--bg-subtle);padding:4px 18px 18px}
.fld{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:12px 0;
 border-bottom:1px solid var(--border);align-items:start}
.fld:last-child{border-bottom:none}
.fld-k{font-size:11.5px;font-weight:600;color:var(--text-3);padding-top:2px}
.fld-v{font-size:13.5px;color:#374151;line-height:1.8}
.fld-v b{font-weight:600;color:var(--text)}
.route{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);
 padding:11px 14px;font-size:13px;color:#374151;line-height:1.75}
.route b{font-weight:600;color:var(--indigo-text)}

/* ── ケースカード ──────────────── */
.case-h{padding:16px 20px 14px;border-bottom:1px solid var(--border)}
.case-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.case-id{font-size:11px;font-weight:600;color:var(--text-2);background:var(--bg-subtle);
 border:1px solid var(--border);padding:2px 9px;border-radius:var(--r-pill)}
.case-t{font-size:16.5px;font-weight:700;line-height:1.55;margin-top:9px;letter-spacing:-.01em}
.case-lede{font-size:13px;color:var(--text-2);margin-top:5px}

/* ── セクター ───────────────────── */
.sec-block{border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:20px}
.sec-row{display:grid;grid-template-columns:132px 1fr 66px;gap:12px;align-items:center;
 padding:9px 0;border-bottom:1px solid var(--border)}
.sec-row:last-child{border-bottom:none}
.sec-n{font-size:13px;font-weight:600}
.sec-n span{display:block;font-size:11px;color:var(--text-3);font-weight:400}
.track{height:22px;background:var(--bg-subtle);border-radius:var(--r-sm);position:relative;overflow:hidden}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border-strong)}
.fillp,.filln{position:absolute;top:4px;bottom:4px;border-radius:3px}
.fillp{left:50%;background:#FCA5A5}
.filln{right:50%;background:#93C5FD}
.sec-v{font-size:12px;font-weight:600;text-align:right}

/* ── グリッド（9マス／2×2） ──────── */
.grid-wrap{border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px}
.grid9{display:grid;grid-template-columns:66px repeat(3,1fr);gap:6px;margin-top:10px}
.rg-grid{display:grid;grid-template-columns:74px 1fr 1fr;gap:6px;margin-top:8px}
.gh{font-size:11px;font-weight:600;color:var(--text-3);display:grid;place-items:center;text-align:center;padding:4px}
.cell,.rg-cell{border:1px solid var(--border);border-radius:var(--r);padding:11px 9px;cursor:pointer;
 background:var(--bg);font-family:inherit;transition:.12s}
.cell{text-align:center}.rg-cell{text-align:left}
.cell:hover,.rg-cell:hover{border-color:var(--indigo);background:var(--indigo-bg)}
.cell[aria-pressed="true"],.rg-cell[aria-pressed="true"]{border-color:var(--indigo);
 background:var(--indigo-bg);box-shadow:0 0 0 1px var(--indigo)}
.cell:focus-visible,.rg-cell:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.cell-v{font-size:12.5px;font-weight:700}
.cell-v.u{color:var(--red)}.cell-v.d{color:var(--blue)}.cell-v.f{color:var(--text-3)}
.cell-l{font-size:10.5px;color:var(--text-2);margin-top:3px;line-height:1.45}
.rg-mode{font-size:13px;font-weight:700}
.rg-mode.den{color:var(--blue)}.rg-mode.num{color:var(--red)}
.rg-desc{font-size:11px;color:var(--text-2);margin-top:3px;line-height:1.5}
.detail{margin-top:14px;border:1px solid var(--border);border-radius:var(--r);
 background:var(--bg-subtle);padding:14px 16px}
.detail-t{font-weight:700;font-size:14px}
.detail-p{font-size:13px;color:var(--text-2);margin-top:5px;line-height:1.8}

/* ── 相関・チェックリスト ────────── */
.corr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 20px 0}
.corr-c{border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.corr-t{font-size:12.5px;font-weight:600}
.corr-s{font-size:11px;color:var(--text-3);margin-bottom:9px}
.corr-r{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.corr-n{width:44px;color:var(--text-2)}
.corr-b{flex:1;height:16px;background:var(--bg-subtle);border-radius:4px;position:relative;overflow:hidden}
.corr-f{position:absolute;top:3px;bottom:3px;border-radius:2px}
.fu{background:#FCA5A5}.fd{background:#93C5FD}
.chk{border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px}
.chk-i{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.chk-i:last-child{border-bottom:none}
.chk-box{flex:0 0 22px;width:22px;height:22px;border:1.5px solid var(--border-strong);
 border-radius:var(--r-sm);background:var(--bg);cursor:pointer;display:grid;place-items:center;
 color:transparent;font-size:12px;transition:.12s;margin-top:2px}
.chk-box[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.chk-box:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.chk-n{font-size:13.5px;font-weight:600}
.chk-d{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.7}

/* ── テスト ─────────────────────── */
.score{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-subtle);
 padding:14px 18px;display:flex;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.score-n{font-size:24px;font-weight:700;letter-spacing:-.02em}
.score-l{font-size:12.5px;color:var(--text-2)}
.bar{flex:1;min-width:120px;height:7px;background:var(--bg-hover);border-radius:4px;overflow:hidden}
.bar-f{height:100%;background:var(--indigo);width:0;transition:width .3s;border-radius:4px}
.reset{font-family:inherit;font-size:12px;background:var(--bg);border:1px solid var(--border);
 border-radius:var(--r-pill);padding:5px 13px;cursor:pointer;color:var(--text-2)}
.reset:hover{background:var(--bg-hover)}
.q-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;padding:18px 20px 0}
.q-n{font-size:11px;font-weight:600;color:var(--text-2);background:var(--bg-subtle);
 border:1px solid var(--border);padding:2px 9px;border-radius:var(--r-pill)}
.q-t{font-size:15px;font-weight:600;line-height:1.65;margin-bottom:13px;padding:0 20px}
.opts{padding:0 20px 18px}
.opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;
 background:var(--bg);border:1px solid var(--border);border-radius:var(--r);

<script>
/* ══ 用語辞書 ══════════════════════ */
const DICT={
 "金利":"お金を借りたときに、元本に上乗せして払う手数料の割合。1年あたり何％かで表す。",
 "元本":"貸し借りしたお金そのもの。利息を含まない、最初の金額。",
 "インフレ":"モノの値段が全体的に上がり続けること。同じ金額で買える量が減る＝お金の価値が下がる。",
 "デフレ":"インフレの逆。モノの値段が全体的に下がり続けること。",

 "債券":"お金を貸した証書。決まった利息をもらい、満期に元本が返ってくる。",

 "中央銀行":"国のお金の量と金利を調節する機関。日本は日銀、米国はFRB。",
 "政策金利":"中央銀行が直接決める、ごく短期の金利。すべての金利の出発点になる。",
 "長期金利":"10年国債利回りなど、返済までが長い金利。市場が将来の政策金利を予想して決まる。",
 "現在価値":"将来もらえるお金を、今の金額に直したらいくらか、という値。",
 "割引率":"将来のお金を今の価値に直すときに使う率。金利が上がるとこれも上がる。",
 "国債":"国が発行する債券。国にお金を貸す形になる。",
 "リスクプレミアム":"リスクを取る見返りとして、上乗せで求められる利回り。",
 "織り込み":"将来起きそうなことを、市場が先に価格に反映させておくこと。"

/* ══ Part 0-1 ══════════════════════ */
const P01=[
{key:"p0",part:"PART 0",title:"ゼロ地点",sub:"ここを飛ばすと、あとで必ず詰まります。",topics:[

   <text class="s-sub" x="326" y="60" text-anchor="middle">1年間 待つ ／ 金利 2％</text>
   <rect class="s-box" x="444" y="42" width="176" height="58" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
   <text class="s-lab" x="532" y="66" text-anchor="middle">1年後、返る</text>
   <text class="s-big s-red" x="532" y="89" text-anchor="middle">102万円</text>
   <text class="s-sub" x="40" y="130">増えた2万円が利息。その割合（2％）が金利。</text></svg>`,
  cap:"金利とは「時間の値段」。長く待つほど、リスクが高いほど大きくなる。",
  deep:["なぜ待つと上乗せがもらえるのか。理由は3つあります。ひとつは、その間そのお金を他に使えないこと（機会費用）。ふたつめは、返ってこないかもしれないこと（信用リスク）。みっつめは、その間に <t>インフレ</t> でお金の価値が下がるかもしれないこと。",
   "この3つ目が重要で、金利には必ずインフレ予想が含まれています。金利からインフレ率を引いたものを実質金利と呼び、実際の負担感を表すのはこちらです。名目金利が5％でもインフレが5％なら、実質的な負担はゼロです。",
   "そして「誰に貸すか」でも金利は変わります。国に貸す（<t>国債</t>）なら低く、危ない会社に貸すなら高い。この上乗せ分が <t>リスクプレミアム</t> です。"]},

 {id:"0-2",q:"インフレとは、何が起きている状態か。",

  fig:`<svg viewBox="0 0 660 172" role="img"><title>インフレの意味</title>

   ${Array.from({length:8},(_,i)=>`<rect x="${210+i*38}" y="107" width="30" height="24" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>`).join("")}
   ${Array.from({length:2},(_,i)=>`<rect x="${514+i*38}" y="107" width="30" height="24" rx="5" fill="none" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="3 3"/>`).join("")}
   <text class="s-big s-red" x="620" y="125" text-anchor="end" font-size="13">8個</text>
   <text class="s-sub" x="40" y="158">パンが偉くなったのではなく、1,000円が弱くなった。</text></svg>`,
  cap:"物価が上がるとき、動いているのはモノではなくお金の側。",
  deep:["この見方に切り替えると、あとの話が全部つながります。インフレでお金の価値が下がるなら、お金を貸している人（債券を持つ人）は損をする。だから貸し手はインフレ分を上乗せした <t>金利</t> を要求する。<b>インフレ予想が上がると金利が上がる</b>のは、このためです。",
   "<t>中央銀行</t> がインフレを警戒するのも同じ理由です。インフレが行きすぎると、給料の上昇が追いつかず生活が苦しくなり、貯金の価値も目減りする。そこで金利を上げて、お金を借りにくくし、消費と投資を冷やして物価を抑えにいきます。",

 {id:"0-3",q:"株を買うと、何を手に入れているのか。",

  deep:["再投資に回した分も、将来の利益を増やして最終的に株主に返ってくるので、株主の取り分であることは変わりません。だから成長段階の会社が <t>配当</t> を出さないこと自体は、悪いことではありません。",
   "重要なのは、株を持つとは<b>将来の利益をすべて受け取る権利</b>だということです。今年の利益だけでなく、来年も再来年も10年後も含まれる。だから株価は今期の業績だけでは決まりません。",
   "そしてこの「将来の分」があるからこそ、金利が株価に効いてきます。将来もらえるお金は、今もらえるお金より価値が低い。この差を計算するのが <t>割引率</t> です。Part 1の本題はここです。"]},

 {id:"0-4",q:"債券とは何か。株とどう違うのか。",

function buildNav(){
  const nav=$("nav");nav.innerHTML="";
  const lbl=document.createElement("div");lbl.className="nav-lbl";lbl.textContent="座学";nav.appendChild(lbl);
  PAGES.forEach(p=>{
    if(p.sec&&!nav.querySelector(`[data-sec="${p.sec}"]`)){
      const l=document.createElement("div");l.className="nav-lbl";l.dataset.sec=p.sec;
      l.textContent=p.sec;nav.appendChild(l);
    }
    const b=document.createElement("button");
    b.className=state.page===p.k?"on":"";b.dataset.k=p.k;
    b.innerHTML=`<span>${p.label}</span><span class="${state.read.has(p.k)?"done":"cnt"}">${
      state.read.has(p.k)?"✓":(p.cnt||"")}</span>`;
    b.onclick=()=>{go(p.k);if(window.innerWidth<=900)toggleSide();};
    nav.appendChild(b);
  });
}
function updProgress(){
  const readPct=state.read.size/READABLE.length*60;
  const testPct=state.answered?Math.min(state.answered/42,1)*40:0;
  const pct=Math.round(readPct+testPct);
  $("progN").textContent=pct+"%";
  $("progBar").style.width=pct+"%";
  $("progS").textContent=state.answered
    ? `読了 ${state.read.size}/5　／　正答 ${state.correct}/${state.answered}　／　復習 ${state.wrong.size}`
    : (state.read.size?`読了 ${state.read.size}/5　／　テストは未着手`:"まだ始まっていません");
}
function toggleSide(){
  $("side").classList.toggle("on");$("scrim").classList.toggle("on");
}
function go(k){
  state.page=k;buildNav();
  const p=PAGES.find(x=>x.k===k);
  $("pageTitle").textContent=p.title;
  window.scrollTo({top:0});
  render();
}
function markRead(k){
  state.read.add(k);buildNav();updProgress();render();
}

/* ══ 実測感応度の読み込み ══════════════
   sensitivities.json があれば SECTORS を実データで置き換える。
   無い場合は概念値のまま動く（GitHub Pages に置く前でも壊れない）。 */
let SENS_META=null;
async function loadSensitivities(){
  try{
    const r=await fetch("sensitivities.json",{cache:"no-cache"});
    if(!r.ok)throw new Error("not found");
    const j=await r.json();
    if(!Array.isArray(j.sectors)||!j.sectors.length)throw new Error("empty");
    SECTORS.length=0;
    j.sectors.forEach(x=>SECTORS.push(x));
    SENS_META={asOf:j.asOf,window:j.window,n:j.observations,r2:j.medianR2};
    if(state.page==="p3")render();
  }catch(_){ /* 概念値のまま続行 */ }
}

function qCard(q,n){

      ex.hidden=false;
      ex.innerHTML=`<span class="verdict ${ok?"v-ok":"v-ng"}">${ok?"正解":"不正解"}</span>${q.e}`;

function pracCard(p,n){
  const d=document.createElement("div");d.className="q";
  d.innerHTML=`<div class="q-top"><span class="q-n">実戦 ${String(n+1).padStart(2,"0")}</span></div>

    const okN=sel.n===p.num,okD=sel.d===p.den,ok=okN&&okD;
    revealPicker(d,p.num,p.den,sel);sub.disabled=true;
    d.querySelector(".ans").innerHTML=`<div class="expl">
      <span class="verdict ${ok?"v-ok":"v-ng"}">${ok?"正解":okN||okD?"惜しい（片方のみ正解）":"不正解"}</span>

function pickerHTML(){
  return `<div class="picker">
    <div><div class="pgrp-l">分子（業績期待）</div><div class="pbtns" data-t="n">
      <button data-v="1" aria-pressed="false">↑</button><button data-v="0" aria-pressed="false">→</button>
      <button data-v="-1" aria-pressed="false">↓</button></div></div>

      <button data-v="-1" aria-pressed="false">↓</button></div></div></div>`;
}
function bindPicker(root,onSubmit){
  const sel={n:null,d:null},sub=root.querySelector(".btn");
  root.querySelectorAll(".pbtns").forEach(grp=>{
    grp.querySelectorAll("button").forEach(b=>{
      b.onclick=()=>{grp.querySelectorAll("button").forEach(y=>y.setAttribute("aria-pressed",y===b));
        sel[grp.dataset.t]=Number(b.dataset.v);sub.disabled=sel.n===null||sel.d===null;};
    });
  });
  sub.onclick=()=>onSubmit(sel,sub);
}
function revealPicker(root,num,den,sel){
  root.querySelectorAll(".pbtns").forEach(grp=>{
    const t=grp.dataset.t,ans=t==="n"?num:den,mine=sel[t];
    grp.querySelectorAll("button").forEach(b=>{b.disabled=true;const v=Number(b.dataset.v);
      if(v===ans)b.classList.add("ok");else if(v===mine)b.classList.add("ng");});
  });
}

        build_market_daily.py を実行して market.json を置くと、実際の数字に切り替わります。
        いまはサンプルを表示しています。</div>`;
    DEMO.forEach(x=>out.appendChild(liveCard(x)));
    return;
  }
  $("src").textContent=`${m.asOf} 時点 ／ ${m.sources||""}`;
  out.innerHTML="";

  if((state.lmode||"decode")==="quiz"){
    const top=(m.indicators||[])[0];
    if(!top){out.innerHTML=`<div class="empty">出題できる指標がありません。</div>`;return;}
    out.appendChild(marketQuiz(top));
    return;
  }

  /* レジーム判定 */
  (m.regimes||[]).forEach(r=>out.appendChild(regimeCard(r)));
  if(m.fx)out.appendChild(fxCard(m.fx));

  /* 指標 */
  (m.indicators||[]).forEach(x=>out.appendChild(indicatorCard(x)));

  const note=document.createElement("div");note.className="note";
  note.innerHTML=`<b>この数字の作り方</b><p>${m.method||""}</p>
    <p>ニュース記事ではなく、統計そのものを見ています。解釈はPart 2〜4で学んだルールをそのまま当てはめており、
    AIによる推測は入っていません。</p>`;
  out.appendChild(note);
}

function regimeCard(r){
  const d=document.createElement("div");d.className="card";
  const cls=r.mode.includes("分母")?"p-d":r.mode.includes("分子")?"p-u":"p-f";
  d.innerHTML=`<div class="case-h"><div class="case-top">
      <span class="case-id">${r.market}</span>
      <span class="pill ${cls}">${r.mode}</span>
      <span class="pill p-p">${r.desc}</span></div>
      <div class="case-t">直近5営業日：金利 ${r.rateChg>=0?"＋":""}${r.rateChg}％pt ／ 株価 ${r.stockChg>=0?"＋":""}${r.stockChg}％</div></div>
    <div class="lab">レジーム判定</div>
    ${chainHTML([["金利","10年国債利回りが "+(r.r>0?"上昇":r.r<0?"低下":"横ばい")],
      ["株価","指数が "+(r.s>0?"上昇":r.s<0?"下落":"横ばい"),1],
      ["判定",r.mode+"（"+r.desc+"）",1]])}
    <div class="why-box">${r.note}</div>`;
  return d;
}

function fxCard(f){
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="case-h"><div class="case-top">
      <span class="case-id">為替</span>
      <span class="pill ${f.chg>=0?"p-u":"p-d"}">${f.dir}</span></div>
      <div class="case-t">ドル円 ${f.value}（直近5営業日 ${f.chg>=0?"＋":""}${f.chg}％）</div></div>
    <div class="why-box">${f.note} Part 3-6のセクター影響マップで「${f.dir}が進む」を選ぶと、
      どの業種が動きやすいかを確認できます。</div>`;
  return d;
}

function indicatorCard(x){
  const d=document.createElement("div");d.className="card";
  const lvCls=x.level==="大"?"p-a":x.level==="中"?"p-d":"p-neutral";
  d.innerHTML=`<div class="case-h"><div class="case-top">
      <span class="case-id">${x.date}</span>
      <span class="pill ${lvCls}">影響度 ${x.level}</span>
      <span class="pill p-neutral">サプライズ ${x.surprise}</span>
      <span class="pill p-neutral">出典 ${x.source}</span></div>
      <div class="case-t">${x.name}　${x.value}</div>
      <div class="case-lede">${x.baseline}　／　zスコア ${x.z>=0?"＋":""}${x.z}</div></div>
    <div class="lab">分数図で見る</div>${fracHTML(x.num,x.den,x.why)}
    <div class="lab">影響度の根拠</div>
    <div class="prose"><p>${x.levelWhy}</p></div>
    <div style="height:18px"></div>`;
  return d;
}

function marketQuiz(x){
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="case-h"><div class="case-top">
      <span class="case-id">${x.date}</span><span class="pill p-p">今日の1問</span></div>
      <div class="case-t">この発表で、分子と分母はどちらに動いたか。</div></div>
    <div class="lab">発表された数字</div>
    <div class="news" style="margin-top:6px"><div class="news-tag">${x.name}</div>
      ${x.value}（${x.baseline}）</div>
    ${pickerHTML()}
    <div style="padding:0 20px 18px"><button class="btn" disabled>答え合わせ</button></div>
    <div class="ans"></div>`;
  bindPicker(d,(sel,sub)=>{
    const okN=sel.n===x.num,okD=sel.d===x.den,ok=okN&&okD;
    revealPicker(d,x.num,x.den,sel);sub.disabled=true;
    d.querySelector(".ans").innerHTML=`<div class="expl">
        <span class="verdict ${ok?"v-ok":"v-ng"}">${ok?"正解":okN||okD?"惜しい（片方のみ正解）":"不正解"}</span>
        正解は 分子 ${AR[x.num]} ／ 分母 ${AR[x.den]}<br>${x.why}</div>
      <div class="lab">分数図で確認する</div>${fracHTML(x.num,x.den,x.why)}
      <div style="height:18px"></div>`;
    mark(ok);
  });
  return d;
}

/* market.json が無いときのサンプル表示用 */
function liveCard(x){
  const sc=x.num-x.den;
  const v=(x.num===x.den&&x.num!==0)?["p-f","拮抗 ／ 局面しだい"]
    :sc>0?["p-u","株価 ↑"]:sc<0?["p-d","株価 ↓"]:["p-f","動きにくい"];
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="case-h"><div class="case-top">
      <span class="case-id">${x.date||"サンプル"}</span>
      <span class="pill ${v[0]}">${v[1]}</span>
      <span class="pill p-p">${x.regime||""}</span></div>
      <div class="case-t">${x.headline}</div></div>
    <div class="lab">経路をたどる</div>
    ${chainHTML([["01 指標",x.indicator],["02 政策予想",x.policy],["03 金利",x.rate],
      ["04 分子・分母",x.valuation,1],["05 株価",x.impact]])}
    <div class="lab">分数図で見る</div>${fracHTML(x.num,x.den,x.valuation)}
    <div class="why-box"><b>ひとことで言うと</b>　${x.why}</div>`;
  return d;
}
